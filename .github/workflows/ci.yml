name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: No secrets in the repo
        run: python scripts/check_secrets.py
      - name: Install
        run: pip install -e .
      - name: Smoke test (no API key needed)
        run: |
          python -m compileall -q jevmeter
          jevmeter --help
          python -c "import json,glob; [json.load(open(p)) for p in glob.glob('jevmeter/presets/*.json')]; print('presets ok')"
          python -c "from jevmeter.transcribe import parse_transcript, split_sentences; t=parse_transcript('examples/mock_debate_transcript.txt'); assert len(t)==17; assert len(split_sentences(t[1]['text']))>=3; print('transcript ok')"
